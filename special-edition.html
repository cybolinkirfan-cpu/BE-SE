<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Edition</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      color: #111;
    }

    /* HERO */
    .hero {
      height: 80vh;
      min-height: 520px;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TYPOGRAPHY */
    .category {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .headline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
    }

    .subhead {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #444;
      max-width: 720px;
    }

    /* STORY CARD */
    .story-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .story-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.3;
    }

    /* FADE-IN */
    .fade-in {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .fade-in.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .hero {
        height: 60vh;
      }
      .story-card img {
        height: 220px;
      }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <img src="./src/hero.webp" alt="Special Edition">
  </section>

  <!-- INTRO -->
  <section class="container my-5">
    <div class="fade-in">
      <p class="category mb-2">Special Edition</p>

      <h1 class="headline mb-3">
        Power, Purpose & Influence
      </h1>

      <p class="subhead">
        A curated editorial celebrating leaders, creators, and
        tastemakers shaping modern culture and luxury.
      </p>
    </div>
  </section>

  <!-- STORIES -->
  <section class="container my-5">
    <div class="row g-4">

      <div class="col-md-4 fade-in">
        <a href="article.html" class="text-decoration-none text-dark">
          <div class="story-card">
            <img src="./src/story1.webp" alt="">
            <p class="category mt-3">Leadership</p>
            <h3 class="story-title">
              Inside the Mind of Asia’s Most Influential Leaders
            </h3>
          </div>
        </a>
      </div>

      <div class="col-md-4 fade-in">
        <div class="story-card">
          <img src="./src/story2.webp" alt="">
          <p class="category mt-3">Luxury</p>
          <h3 class="story-title">
            The New Language of Quiet Luxury
          </h3>
        </div>
      </div>

      <div class="col-md-4 fade-in">
        <div class="story-card">
          <img src="./src/story3.webp" alt="">
          <p class="category mt-3">Culture</p>
          <h3 class="story-title">
            How Culture Shapes Modern Power
          </h3>
        </div>
      </div>

    </div>
  </section>

  <!-- SCROLL ANIMATION -->
  <script>
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>

</body>
</html>
